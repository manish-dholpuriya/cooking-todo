<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BitePlan - Daily Meal Planner</title>
    <!-- Google Fonts for Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="app-container">
      <header class="header">
        <h1>BitePlan</h1>
        <div class="budget-input-group">
          <label for="dailyBudget">Daily Budget ($)</label>
          <input type="number" id="dailyBudget" value="20" min="5" step="1">
        </div>
      </header>

      <main class="main-content">
        <section class="context-selector glass-panel">
          <h2>How's your day looking?</h2>
          <div class="context-buttons">
            <button class="context-btn active" data-context="busy">🏃‍♂️ Busy</button>
            <button class="context-btn" data-context="workout">🏋️ Workout</button>
            <button class="context-btn" data-context="lazy">🛋️ Lazy</button>
          </div>

          <h2>Any diet preferences?</h2>
          <div class="diet-buttons" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
            <button class="diet-btn active" data-diet="None">🍽️ None</button>
            <button class="diet-btn" data-diet="Vegetarian">🥗 Veggie</button>
            <button class="diet-btn" data-diet="Keto">🥩 Keto</button>
            <button class="diet-btn" data-diet="Gluten-Free">🌾 GF</button>
          </div>

          <button id="generatePlanBtn" class="primary-btn">Generate Meal Plan</button>
        </section>

        <section class="plan-display">
          <h2>Your Plan</h2>
          <div id="mealCards" class="meal-cards">
            <!-- Meal cards will be injected here by JS -->
            <p style="color: var(--text-muted); padding: 2rem; text-align: center;">Click "Generate Meal Plan" to see your day.</p>
          </div>

          <div id="cookingTodoList" class="cooking-todo-list" style="display: none; margin-top: 2.5rem;">
            <h2>Cooking To-Do List</h2>
            <div id="todoContainer" class="todo-container glass-panel">
               <!-- To Do Items injected by JS -->
            </div>
          </div>
        </section>

        <aside class="sidebar glass-panel">
          <div class="budget-tracker">
            <h3>Budget Feasibility</h3>
            <div class="budget-meter">
              <div id="budgetFill" class="budget-fill"></div>
            </div>
            <p id="budgetStatus" class="budget-status">$0.00 / $20.00</p>
          </div>
          
          <div class="grocery-list">
            <h3>Grocery List</h3>
            <ul id="groceryItems">
              <!-- Grocery items injected by JS -->
              <li style="color: var(--text-muted); font-size: 0.9rem;">No items yet.</li>
            </ul>
          </div>
        </aside>
      </main>
    </div>

    <div id="aiLoadingOverlay" class="ai-loading-overlay">
      <div class="spinner"></div>
      <h2>AI is generating your perfect day...</h2>
    </div>
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
